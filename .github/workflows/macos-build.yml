name: macOS builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: intel
          - runner: macos-15
            arch: apple-silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build unsigned installer
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Music-Video-Curator-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
